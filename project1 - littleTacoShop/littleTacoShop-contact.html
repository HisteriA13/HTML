<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Hilda&Allie">
    <meta name="description" content="Little Taco Shop">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Little Taco Shop</title>
    <link rel="icon" href="/assets/img/taco.ico" type="image/x-icon">
</head>

<body>
    <header id="contacts">
        <article>
            <h1>Contact Us</h1>
            <nav>
                <ul>
                    <li>
                        <a href="littleTacoShop-index.html">Home</a>
                    </li>
                    <li>
                        <a href="littleTacoShop-index.html#about">About <abbr
                                title="The Little Taco Shop">LTS</abbr></a>
                    </li>
                    <li>
                        <a href="littleTacoShop-index.html#menu">Our Menu</a>
                    </li>
                    <li>
                        <a href="littleTacoShop-hours.html">Store Hours</a>
                    </li>
                </ul>
            </nav>
            <figure>
                <img src="assets/img/tacosCloseUp.png" alt="Little Taco Shop Tacos">
                <figcaption>Little Taco Shop Tacos</figcaption>
            </figure>
            <hr>
        </article>
    </header>

    <main>
        <h2>Our Contact Form</h2>
        <form action="https://httpbin.org/get" method="get"></form>
        <fieldset>
            <legend>Send Us a Message</legend>
            <p><label for="firstName">Name:</label>
                <input type="text" name="firstName" id="firstName" placeholder="your name">
            </p>
            <p>
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" placeholder="your email">
            </p>
            <p>
                <label for="message">Your Message:</label>
                <br>
                <textarea name="message" id="message" cols="30" rows="10">Type your message here...</textarea>
            </p>
        </fieldset>
        <button type="submit">Send</button>
        <button type="reset">Reset</button>
        <article>
            <h2>Our Location</h2>
            <address>555 Taco Temptation Lane, Suite T <br>
                Kansas City, MO 55555-5555 <br><br>
                Phone: <a href="tel:+5555555555">555-555-5555</a>
            </address>
        </article>
        <br>
    </main>

    <footer>
        <a href="#">Back to Top</a>
        <hr>
        <p>Copyright &copy; The Little Taco Shop</p>
    </footer>
</body>

</html>
